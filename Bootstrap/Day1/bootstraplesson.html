<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"crossorigin="anonymous">
    
</head>
<body>
<div class="container mt-5">
<div class="row">    
    <div class="col-lg-3"> 
        <div class="bg-primary text-white p-4"> 
            <h5>Primary</h5> 
            <p>Main theme colors</p>
        </div>
    </div>
    <div class="col-lg-3">
        <div class="bg-success text-white p-4">
           <h4>Success</h4> 
           <p>Indicates a successful or positive action</p>
        </div>
    </div>
    <div class="col-lg-3">
        <div class="bg-warning text-white p-4">
           <h4>Warning</h4> 
           <p>Indicates a warning or cautionary action</p>
        </div>
    </div>
    <div class="col-lg-3">
        <div class="bg-danger text-white p-4">
           <h4>Danger</h4> 
           <p>Indicates a dangerous or negative action</p>
        </div>


 
</div>
</div>

    
</body>
</html>
