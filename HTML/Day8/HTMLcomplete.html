    root tag of webpage.Main root -->


    <html lang="en">


     <head>
<!-- head for title --> 

     <meta charset="UTF-8"> 
<!-- charset decides which character set to use -->
<!-- UTF-8, Unicode Transformation Format - 8-bit encoding -->


    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- meta name="viewport" - controls layout on mobile browsers, tells the 
browser how to scale and display a webpage properly on different devices -->
<!-- width=device-width (sets the width of the page to the width of the device), initial-scale=1.0 -->
