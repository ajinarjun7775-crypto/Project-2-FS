<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<center>
<body>
    <h1>Login / Signup</h1>

    <h2>Login</h2>
    <form>
        <label>Email:</label>
        <input type="email" placeholder="abc@email.com" required>
        <br><br>
        <label>Password:</label>
        <input type="password" placeholder="Enter the password" minlength="8" required>
        <br><br>
        <input type="submit" value="Login">
    </form>
    <hr>
    <h2>Signup</h2>
    <form>
        <label>Full Name:</label>
        <input type="text" placeholder="Enter the name" required>
        <br><br>
        <label>Email:</label>
        <input type="email" placeholder="abc@email.com"required>
        <br><br>
        <label>Password:</label>
        <input type="password" placeholder="Enter the password" minlength="8" required>
        <br><br>
        <input type="submit" value="Signup">
    </form>
    
</body>
</center>
</html>
