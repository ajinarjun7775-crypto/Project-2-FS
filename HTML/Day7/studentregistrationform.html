<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

</head>
<center>
<body>
    <div>
        <h2>Student Registration Form</h2>
        
            
            <!-- Text Input -->
           <div>
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
            </div>
            <br>
            
            <!-- Email Input -->
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" placeholder="example@student.edu" required>
            </div>
            <br>
            <!-- Password Input -->
            <div class="form-group">
                <label for="password">Create Password *</label>
                <input type="password" id="password" name="password" placeholder="Enter a strong password" required>
            </div>
            <br>
            <!-- Telephone Input -->
            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
            </div>
            <br>
            <!-- Date Input -->
            <div class="form-group">
                <label for="dob">Date of Birth *</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <br>
            <!-- Radio Buttons (Gender) -->
            <div class="form-group">
                <label>Gender *</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>
            <br>
            <!-- Select Dropdown -->
            <div class="form-group">
                <label for="course">Course / Program *</label>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="btech">B.Tech / B.E.</option>
                    <option value="bsc">B.Sc.</option>
                    <option value="ba">B.A.</option>
                    <option value="bca">BCA</option>
                    <option value="bcom">B.Com</option>
                    <option value="mba">MBA</option>
                    <option value="mtech">M.Tech</option>
                </select>
            </div>
            <br>
            <!-- Checkboxes -->
            <div class="form-group">
                <label>Interests / Hobbies (Select all that apply)</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="interests" value="programming"> Programming</label>
                    <label><input type="checkbox" name="interests" value="sports"> Sports</label>
                    <label><input type="checkbox" name="interests" value="music"> Music</label>
                    <label><input type="checkbox" name="interests" value="reading"> Reading</label>
                    <label><input type="checkbox" name="interests" value="dance"> Dance</label>
                    <label><input type="checkbox" name="interests" value="art"> Art &amp; Painting</label>
                </div>
            </div>
            <br>
            <!-- Textarea -->
            <div class="form-group">
                <label for="address">Permanent Address *</label>
                <textarea id="address" name="address" rows="4" placeholder="Enter your full address" required></textarea>
            </div>
            <br>
            <!-- Additional Text Input -->
            <div class="form-group">
                <label for="guardian">Guardian / Parent Name</label>
                <input type="text" id="guardian" name="guardian" placeholder="Father / Mother Name">
            </div>
            <br>
            <!-- Submit Button -->
            <button type="submit">Register Student</button>
        </form>
    </div>
</body>
</center>

</html>
