<html>
<center>
<head>
<title>Product List Inventory</title>
</head>

<body>
    
    <h1>Product List Inventory</h1>

    <section>
        <img src="../assets/orangeform.webp" width="50">
        <div>
            <form>
            <label>Product Name:</label>
            <input type="text" name="product_name" required>
            <br><br>
            <label>Category:</label>
            <input type="text" name="category" required> 
            
            <label>Licensed:</label>
            <select name="Licensed" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        
            <br><br>


            <label>Price:</label>
            <input type="number" name="price" step="0.01" required>
            <label>Approved By :</label>
            <select>
                <option value="FSSI">FSSI</option>
                <option value="GST">GST</option>
                <option value="Other LICENSED">Other</option>
            </select>
            <br><br>
            <label>Stock:</label>
            <input type="number" name="stock" min="0" required>
            <br><br>

            <label> Ship ID : </label>
            <input type="text" number name="ship_id" required>

            <br><br>
            <label> Weight(in tons) : </label>
            <input type="number" number name="weight" min="0" required>

        
            <label>City:</label>
            <input type="text" name="city" required>
            <br><br>
            
            <input type="submit" value="Add Product">
            <input type="reset">
            </form>
        </div>
    </section>
