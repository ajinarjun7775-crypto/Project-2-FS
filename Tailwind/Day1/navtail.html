<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Navbar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            padding: 2rem;
            min-height: 100vh;
        }
        .navbar {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="bg-white shadow-lg navbar">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex justify-between items-center py-5">
                
                <!-- Logo -->
                <div class="flex items-center p-2 bg-yellow-300 rounded-lg shadow-md">
                    <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-md">
                        <img src="../../CSS/assets/flipkart/favicon.png" alt="">
                    </div>
                    <span class="ml-3 text-2xl font-semibold text-gray-900">Flipkart</span>
                </div>

                <!-- Menu Items -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#" 
                       class="text-gray-700 hover:text-blue-600 font-medium transition-colors">
                        Home
                    </a>
                    <a href="#" 
                       class="text-gray-700 hover:text-blue-600 font-medium transition-colors">
                        About
                    </a>
                    <a href="#" 
                       class="text-gray-700 hover:text-blue-600 font-medium transition-colors">
                        Contact
                    </a>
                </div>

                <!-- Login Button -->
                <div class="flex items-center">
                    <button onclick="alert('Login clicked!')" 
                            class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors">
                        Login
                    </button>
                </div>

                <!-- Mobile Menu Button -->
                <button id="mobile-menu-button"
                        class="md:hidden text-gray-700 hover:text-gray-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t">
            <div class="px-6 py-6 space-y-4">
                <a href="#" class="block text-gray-700 hover:text-blue-600 font-medium">Home</a>
                <a href="#" class="block text-gray-700 hover:text-blue-600 font-medium">About</a>
                <a href="#" class="block text-gray-700 hover:text-blue-600 font-medium">Contact</a>
                <button onclick="alert('Login clicked!')" 
                        class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg">
                    Login
                </button>
            </div>
        </div>
    </nav>

    
</body>
</html>
