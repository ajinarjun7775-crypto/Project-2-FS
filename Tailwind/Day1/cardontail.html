<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card on tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
    </style>
</head>
<body>
<div class="bg-white shadow-lg p-5 max-w-lg w-full">
     <div class="mb-4">
        <img src="../../CSS/assets/Volvo/volvo-main.jpg" alt="Image" width="500px">
     </div>
     <h3 class="text-xl font-semibold text-gray-900 mb-2">Volvo car</h3>
     <p class="text-gray-600 mb-5 text-sm leading-relaxed">The electric Volvo car is a great choice for eco-conscious drivers.</p>
     <button onclick="alert('button clicked!')" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
       Click here
     </button> 
</div>   
</body>
</html>
